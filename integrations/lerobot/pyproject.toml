[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_env_so101_bench"
version = "0.1.0"
description = "SO-101 Bench (Isaac Sim) as a LeRobot evaluation environment: --env.type=so101_bench"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.12"
dependencies = [
    "lerobot>=0.6.1",
    "gymnasium>=1.1.1,<2.0.0",
    "numpy>=2.0.0",
    "pyzmq>=25",
    "msgpack>=1.0",
]

[project.urls]
Homepage = "https://so101-bench.github.io/"
Repository = "https://github.com/5hadytru/so101_bench"

[tool.setuptools]
packages = ["lerobot_env_so101_bench"]
